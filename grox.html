<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Web App</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const Header = () => {
      const [isScrolled, setIsScrolled] = React.useState(false);

      React.useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 0);
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <header className="fixed top-0 left-0 w-full z-50 flex justify-center">
          <div className={`w-full md:max-w-3xl bg-blue-200 px-4 py-4 ${isScrolled ? 'shadow-md' : ''}`}>
            <h1 className="text-xl sm:text-2xl md:text-3xl font-bold text-gray-800">
              Responsive Web App
            </h1>
          </div>
        </header>
      );
    };

    const ResolutionLabel = () => {
      return (
        <div className="fixed bottom-0 left-0 bg-gray-800 text-white px-2 py-1 z-50">
          <span className="text-xs">
            Resolution: 
            <span className="inline-block sm:hidden">XSmall</span>
            <span className="hidden sm:inline-block md:hidden">Small</span>
            <span className="hidden md:inline-block lg:hidden">Medium</span>
            <span className="hidden lg:inline-block xl:hidden">Large</span>
            <span className="hidden xl:inline-block">Extra Large</span>
          </span>
        </div>
      );
    };

    const App = () => {
      const christianSongs = [
        "Amazing Grace",
        "How Great Is Our God",
        "10,000 Reasons (Bless the Lord)",
        "Mighty to Save",
        "What a Friend We Have in Jesus",
        "Jesus Paid It All",
        "In the Garden",
        "The Old Rugged Cross",
        "Great Is Thy Faithfulness",
        "Blessed Assurance",
        "Holy Forever",
        "Goodness of God",
        "Way Maker",
        "To God Be the Glory",
        "I Can Only Imagine",
        "Reckless Love",
        "A Mighty Fortress Is Our God",
        "Take My Life and Let It Be",
        "What a Beautiful Name",
        "Onward Christian Soldiers",
        "Oceans (Where Feet May Fail)",
        "How Deep the Father's Love for Us",
        "Here I Am to Worship",
        "Cornerstone",
        "Be Thou My Vision",
        "Shout to the Lord",
        "In Christ Alone",
        "Build My Life",
        "Come Thou Fount of Every Blessing",
        "Revelation Song",
        "Holy Spirit",
        "It Is Well with My Soul",
        "Lord, I Need You",
        "This Is Amazing Grace",
        "Good Good Father",
        "At the Cross",
        "Forever",
        "Jesus Messiah",
        "Our God",
        "Open the Eyes of My Heart"
      ];

      return (
        <div className="bg-gray-100 flex justify-center">
          <div className="w-full md:max-w-3xl">
            <Header />
            <main className="mx-auto px-4 pt-20 pb-16">
              <section className="mt-4">
                <ul className="mt-2 text-sm sm:text-base md:text-lg text-gray-600 list-disc pl-5">
                  {christianSongs.map((song, index) => (
                    <li key={index}>{song}</li>
                  ))}
                </ul>
              </section>
            </main>
            <ResolutionLabel />
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
